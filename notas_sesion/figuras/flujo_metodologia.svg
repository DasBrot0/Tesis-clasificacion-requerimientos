<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1050" viewBox="0 0 1640 1050" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdba74"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0abfc"/></marker>
    <style>
      .t  { fill:#e2e8f0; font-size:15px; text-anchor:middle; }
      .tb { fill:#f8fafc; font-size:15px; font-weight:600; text-anchor:middle; }
      .ts { fill:#94a3b8; font-size:12.5px; text-anchor:middle; }
      .h  { font-size:19px; font-weight:700; letter-spacing:1.5px; text-anchor:middle; }
      .b1 { fill:#0c4a6e; fill-opacity:.55; stroke:#38bdf8; stroke-width:1.6; }
      .b2 { fill:#7c2d12; fill-opacity:.5; stroke:#fb923c; stroke-width:1.6; }
      .b3 { fill:#701a75; fill-opacity:.45; stroke:#e879f9; stroke-width:1.6; }
      .l1 { stroke:#7dd3fc; stroke-width:2; fill:none; marker-end:url(#a1); }
      .l2 { stroke:#fdba74; stroke-width:2; fill:none; marker-end:url(#a2); }
      .l3 { stroke:#f0abfc; stroke-width:2; fill:none; marker-end:url(#a3); }
    </style>
  </defs>

  <rect width="1640" height="1050" fill="#0b1220"/>

  <!-- ===================== FASE 1 ===================== -->
  <rect x="20" y="20" width="1600" height="420" rx="14" fill="#0f2235" stroke="#38bdf8" stroke-width="2"/>
  <text x="820" y="52" class="h" fill="#7dd3fc">FASE 1 · PREPARACIÓN DE LOS DATASETS</text>

  <!-- cilindros de entrada -->
  <g>
    <path d="M40,137 v62 a85,11 0 0 0 170,0 v-62" class="b1"/>
    <ellipse cx="125" cy="137" rx="85" ry="11" class="b1"/>
    <text x="125" y="172" class="tb">PROMISE_exp</text><text x="125" y="190" class="tb">_translated</text>
  </g>
  <g>
    <path d="M40,237 v62 a85,11 0 0 0 170,0 v-62" class="b1"/>
    <ellipse cx="125" cy="237" rx="85" ry="11" class="b1"/>
    <text x="125" y="282" class="tb">SecReq</text>
  </g>
  <g>
    <path d="M40,337 v62 a85,11 0 0 0 170,0 v-62" class="b1"/>
    <ellipse cx="125" cy="337" rx="85" ry="11" class="b1"/>
    <text x="125" y="382" class="tb">DOSSPRE</text>
  </g>

  <!-- traducción: solo SecReq y DOSSPRE -->
  <rect x="250" y="228" width="150" height="190" rx="10" class="b1"/>
  <text x="325" y="310" class="tb">Traducción</text>
  <text x="325" y="330" class="tb">al español</text>
  <text x="325" y="352" class="ts">DeepL + glosario</text>

  <!-- pasos comunes -->
  <rect x="430" y="118" width="150" height="300" rx="10" class="b1"/>
  <text x="505" y="255" class="tb">Depuración de</text><text x="505" y="275" class="tb">duplicados e</text><text x="505" y="295" class="tb">incompletos</text>

  <rect x="610" y="118" width="150" height="300" rx="10" class="b1"/>
  <text x="685" y="255" class="tb">Etiquetado en</text><text x="685" y="275" class="tb">subcategorías</text><text x="685" y="295" class="tb">de seguridad</text>
  <text x="685" y="320" class="ts">ISO/IEC 25010:2023</text>

  <rect x="790" y="118" width="150" height="300" rx="10" class="b1"/>
  <text x="865" y="255" class="tb">Validación por</text><text x="865" y="275" class="tb">expertos</text>
  <text x="865" y="300" class="ts">acuerdo entre</text><text x="865" y="316" class="ts">evaluadores (κ)</text>

  <rect x="970" y="118" width="150" height="300" rx="10" class="b1"/>
  <text x="1045" y="255" class="tb">Partición</text><text x="1045" y="275" class="tb">estratificada</text>
  <text x="1045" y="300" class="ts">Test 15 % +</text><text x="1045" y="316" class="ts">5 folds (Train / Val.)</text>

  <rect x="1150" y="118" width="150" height="300" rx="10" class="b1"/>
  <text x="1225" y="255" class="tb">Balanceo</text><text x="1225" y="275" class="tb">de clases</text>
  <text x="1225" y="300" class="ts">solo sobre Train</text>

  <!-- cilindros de salida -->
  <g>
    <path d="M1335,137 v62 a135,11 0 0 0 270,0 v-62" class="b1" style="fill-opacity:.85"/>
    <ellipse cx="1470" cy="137" rx="135" ry="11" class="b1" style="fill-opacity:.85"/>
    <text x="1470" y="172" class="tb">PROMISE_exp_translated</text><text x="1470" y="190" class="tb">curado</text>
  </g>
  <g>
    <path d="M1335,237 v62 a135,11 0 0 0 270,0 v-62" class="b1" style="fill-opacity:.85"/>
    <ellipse cx="1470" cy="237" rx="135" ry="11" class="b1" style="fill-opacity:.85"/>
    <text x="1470" y="282" class="tb">SecReq curado</text>
  </g>
  <g>
    <path d="M1335,337 v62 a135,11 0 0 0 270,0 v-62" class="b1" style="fill-opacity:.85"/>
    <ellipse cx="1470" cy="337" rx="135" ry="11" class="b1" style="fill-opacity:.85"/>
    <text x="1470" y="382" class="tb">DOSSPRE curado</text>
  </g>

  <!-- flechas fase 1 -->
  <line x1="210" y1="175" x2="428" y2="175" class="l1" stroke-dasharray="6 5"/>
  <text x="325" y="166" class="ts">ya está en español</text>
  <line x1="210" y1="275" x2="248" y2="275" class="l1"/>
  <line x1="210" y1="375" x2="248" y2="375" class="l1"/>
  <line x1="400" y1="275" x2="428" y2="275" class="l1"/>
  <line x1="400" y1="375" x2="428" y2="375" class="l1"/>
  <g>
    <line x1="580" y1="175" x2="608" y2="175" class="l1"/><line x1="580" y1="275" x2="608" y2="275" class="l1"/><line x1="580" y1="375" x2="608" y2="375" class="l1"/>
    <line x1="760" y1="175" x2="788" y2="175" class="l1"/><line x1="760" y1="275" x2="788" y2="275" class="l1"/><line x1="760" y1="375" x2="788" y2="375" class="l1"/>
    <line x1="940" y1="175" x2="968" y2="175" class="l1"/><line x1="940" y1="275" x2="968" y2="275" class="l1"/><line x1="940" y1="375" x2="968" y2="375" class="l1"/>
    <line x1="1120" y1="175" x2="1148" y2="175" class="l1"/><line x1="1120" y1="275" x2="1148" y2="275" class="l1"/><line x1="1120" y1="375" x2="1148" y2="375" class="l1"/>
    <line x1="1300" y1="175" x2="1333" y2="175" class="l1"/><line x1="1300" y1="275" x2="1333" y2="275" class="l1"/><line x1="1300" y1="375" x2="1333" y2="375" class="l1"/>
  </g>
  <text x="865" y="432" class="ts">Cada dataset recorre los mismos pasos por separado; no se mezclan.</text>

  <!-- ===================== FASE 2 ===================== -->
  <rect x="20" y="460" width="1600" height="330" rx="14" fill="#2a160c" stroke="#fb923c" stroke-width="2"/>
  <text x="820" y="492" class="h" fill="#fdba74">FASE 2 · ENTRENAMIENTO</text>

  <g>
    <path d="M40,575 v62 a85,11 0 0 0 170,0 v-62" class="b2"/>
    <ellipse cx="125" cy="575" rx="85" ry="11" class="b2"/>
    <text x="125" y="612" class="tb">Dataset curado</text>
    <text x="125" y="672" class="ts">PROMISE, SecReq y DOSSPRE,</text>
    <text x="125" y="688" class="ts">cada uno por separado</text>
  </g>

  <rect x="250" y="565" width="170" height="90" rx="10" class="b2"/>
  <text x="335" y="598" class="tb">Tokenización y</text><text x="335" y="618" class="tb">representación</text><text x="335" y="638" class="tb">vectorial</text>

  <rect x="460" y="525" width="250" height="170" rx="12" class="b2"/>
  <text x="585" y="551" class="tb">Entrenamiento</text>
  <rect x="478" y="566" width="102" height="44" rx="8" fill="#431407" stroke="#fdba74"/><text x="529" y="593" class="t">CNN</text>
  <rect x="590" y="566" width="102" height="44" rx="8" fill="#431407" stroke="#fdba74"/><text x="641" y="593" class="t">BiLSTM</text>
  <rect x="478" y="620" width="102" height="44" rx="8" fill="#431407" stroke="#fdba74"/><text x="529" y="647" class="t">BETO</text>
  <rect x="590" y="620" width="102" height="44" rx="8" fill="#431407" stroke="#fdba74"/><text x="641" y="647" class="t">RoBERTa-BNE</text>
  <text x="585" y="684" class="ts">un modelo por arquitectura y dataset</text>

  <rect x="750" y="565" width="190" height="90" rx="10" class="b2"/>
  <text x="845" y="592" class="tb">Evaluación en</text><text x="845" y="612" class="tb">validación cruzada</text>
  <text x="845" y="636" class="ts">Macro-F1 y recall de Security</text>

  <polygon points="1060,555 1145,610 1060,665 975,610" class="b2"/>
  <text x="1060" y="604" class="tb">¿Quedan</text><text x="1060" y="624" class="tb">trials?</text>

  <rect x="720" y="712" width="250" height="62" rx="10" class="b2"/>
  <text x="845" y="738" class="tb">Ajuste de hiperparámetros</text><text x="845" y="757" class="ts">Optuna propone otra configuración</text>

  <rect x="1180" y="565" width="190" height="90" rx="10" class="b2"/>
  <text x="1275" y="592" class="tb">Mejor configuración</text>
  <text x="1275" y="616" class="ts">y umbral por etiqueta</text><text x="1275" y="632" class="ts">(predicciones out-of-fold)</text>

  <rect x="1405" y="565" width="200" height="90" rx="10" class="b2" style="fill-opacity:.85"/>
  <text x="1505" y="598" class="tb">Modelo final y</text><text x="1505" y="618" class="tb">evaluación en Test</text>
  <text x="1505" y="640" class="ts">una sola vez</text>

  <!-- flechas fase 2 -->
  <line x1="210" y1="610" x2="248" y2="610" class="l2"/>
  <line x1="420" y1="610" x2="458" y2="610" class="l2"/>
  <line x1="710" y1="610" x2="748" y2="610" class="l2"/>
  <line x1="940" y1="610" x2="973" y2="610" class="l2"/>
  <line x1="1145" y1="610" x2="1178" y2="610" class="l2"/>
  <text x="1162" y="600" class="ts">No</text>
  <polyline points="1060,665 1060,743 972,743" class="l2"/>
  <text x="1075" y="700" class="ts">Sí</text>
  <polyline points="720,743 585,743 585,697" class="l2"/>
  <line x1="1370" y1="610" x2="1403" y2="610" class="l2"/>

  <!-- ===================== FASE 3 ===================== -->
  <rect x="20" y="810" width="1600" height="225" rx="14" fill="#2a0f2d" stroke="#e879f9" stroke-width="2"/>
  <text x="820" y="842" class="h" fill="#f0abfc">FASE 3 · EVALUACIÓN Y ANÁLISIS DE RESULTADOS</text>

  <rect x="1385" y="880" width="220" height="110" rx="10" class="b3"/>
  <text x="1495" y="910" class="tb">Métricas de evaluación</text>
  <text x="1495" y="934" class="ts">Precision, Recall y F1</text><text x="1495" y="950" class="ts">por etiqueta</text>
  <text x="1495" y="970" class="ts">Macro-F1 · Weighted-F1</text>

  <rect x="1030" y="880" width="240" height="110" rx="10" class="b3"/>
  <text x="1150" y="920" class="tb">Regla de coherencia</text>
  <text x="1150" y="944" class="ts">sin Security no hay</text><text x="1150" y="960" class="ts">subcategoría</text>

  <rect x="700" y="880" width="250" height="110" rx="10" class="b3"/>
  <text x="825" y="912" class="tb">Comparación de</text><text x="825" y="932" class="tb">modelos por dataset</text>
  <text x="825" y="956" class="ts">Scott-Knott ESD (folds)</text><text x="825" y="972" class="ts">McNemar (Test)</text>

  <rect x="400" y="880" width="220" height="110" rx="10" class="b3"/>
  <text x="510" y="920" class="tb">Análisis por</text><text x="510" y="940" class="tb">subcategoría</text>
  <text x="510" y="964" class="ts">y de errores</text>

  <rect x="70" y="880" width="250" height="110" rx="10" class="b3" style="fill-opacity:.9;stroke-width:2.4"/>
  <text x="195" y="930" class="tb">Elección del</text><text x="195" y="950" class="tb">mejor modelo</text>

  <!-- flechas fase 3 (de derecha a izquierda) -->
  <polyline points="1505,655 1505,800 1495,800 1495,878" class="l3"/>
  <line x1="1385" y1="935" x2="1272" y2="935" class="l3"/>
  <line x1="1030" y1="935" x2="952" y2="935" class="l3"/>
  <line x1="700" y1="935" x2="622" y2="935" class="l3"/>
  <line x1="400" y1="935" x2="322" y2="935" class="l3"/>
</svg>
